<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suggest a Coin | VaultVerse Coins</title>
  <meta name="description" content="Suggest a coin community for a future VaultVerse weekly game.">
  <link rel="stylesheet" href="./platform.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><img class="mark" src="./vaultverse-hub.jpg" alt=""><span>VaultVerse Coins</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="./">Current Game</a>
      <a href="./previous-games.html">Previous Games</a>
      <a href="./vote.html">Vote</a>
      <a href="./admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section class="section slim">
      <div class="eyebrow">Community Picks</div>
      <h1>Suggest a Coin</h1>
      <p class="lead">Nominate a coin community for a future weekly VaultVerse game.</p>
      <div id="suggestNotice" class="notice" hidden></div>
      <form id="suggestForm" class="form-grid">
        <div class="field">
          <label for="coinName">Coin name</label>
          <input id="coinName" name="coinName" required placeholder="Example: Rizz Bull">
        </div>
        <div class="field">
          <label for="xAccount">X account</label>
          <input id="xAccount" name="xAccount" placeholder="@coincommunity">
        </div>
        <div class="field">
          <label for="website">Website or contract</label>
          <input id="website" name="website" placeholder="Website, pump.fun link, or contract address">
        </div>
        <div class="field">
          <label for="description">Short description</label>
          <textarea id="description" name="description" required placeholder="Why would this community make a good weekly game?"></textarea>
        </div>
        <button class="btn primary" type="submit">Submit Suggestion</button>
      </form>
    </section>
  </main>

  <footer class="footer"><span>VaultVerse Coins</span><span>Suggest. Vote. Play.</span></footer>
  <script src="./platform-data.js"></script>
  <script src="./platform.js"></script>
</body>
</html>
